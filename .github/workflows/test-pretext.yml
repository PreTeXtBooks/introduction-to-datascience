name: Test PreTeXt Book Build

on:
  # Run on pull requests targeting main to verify the book builds
  pull_request:
    branches:
      - main

# Cancel in-progress runs for the same PR when new commits are pushed
concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PreTeXt CLI
        run: |
          pip install -r pretext/requirements.txt
      
      - name: Prepare Runestone services fallback cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from pretext import resources
          
          cache_dir = Path(resources.resource_base_path()) / "rs_cache"
          cache_dir.mkdir(parents=True, exist_ok=True)
          source = cache_dir / "runestone_services.xml"
          fallback = cache_dir / "rs_services.xml"
          
          if source.exists() and not fallback.exists():
              fallback.write_text(source.read_text())
          PY

      - name: Build PreTeXt book (HTML)
        run: |
          cd pretext
          pretext build web
          # Verify build succeeded by checking if output exists
          if [ ! -d "output/web" ]; then
            echo "Build failed: output/web directory not created"
            exit 1
          fi
          echo "Build succeeded: output/web directory exists"
